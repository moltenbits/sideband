#Fri Sep 04 16:48:28 GMT-05:00 2026
micronaut.application.name=sideband
# Command output is a protocol: empty lists and false booleans are written, never omitted.
micronaut.serde.serialization.inclusion=always
# Timestamps are RFC 3339 strings with an offset, never epoch numbers.
micronaut.serde.write-dates-as-timestamps=false
# Readers must ignore metadata fields they do not know (REQUIREMENTS.md 6.2).
micronaut.serde.deserialization.ignore-unknown=true
