# Runs on every pull request against main, never on plain pushes: main only
# changes through pull requests, and this is the check that gates them. The
# native executable is built for every target the release builds, on the same
# runners, so a platform problem shows up here rather than at the tag.
name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graalvm-from-sdkmanrc
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the Spock suite
        run: ./gradlew test
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  native:
    name: Native executable (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graalvm-from-sdkmanrc
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the native image
        run: ./gradlew nativeCompile
      - name: Smoke-test the executable
        run: |
          ./build/native/nativeCompile/sideband --version
          ./build/native/nativeCompile/sideband --help > /dev/null
